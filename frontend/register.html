<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ResumeAI Intelligence</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .auth-page-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <div class="auth-page-container">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <a href="/" class="sidebar-logo" style="justify-content: center; margin-bottom: 12px;">
          <div class="sidebar-logo-icon">AI</div>
          <span>ResumeAI</span>
        </a>
        <h2 style="font-size: 1.5rem; margin-bottom: 6px;">Create New Account</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem;">Join the recruitment intelligence platform</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. Alex Johnson" required minlength="2">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Account Role</label>
          <select id="role" class="form-control">
            <option value="USER">Candidate / Job Seeker</option>
            <option value="HR">HR Recruiter / Hiring Manager</option>
            <option value="ADMIN">System Administrator</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-secondary);">
        Already registered? <a href="/login.html" style="font-weight: 600;">Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
